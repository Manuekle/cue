name: Cue
options:
  bundleIdPrefix: com.manudev
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: PFXAB2V4ZM
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Cue:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Cue usa la cámara para grabarte mientras lees tu guion.
        NSMicrophoneUsageDescription: Cue usa el micrófono para grabar tu voz junto con el video.
        NSPhotoLibraryAddUsageDescription: Cue guarda tus videos en Fotos.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manudev.pronter
        PRODUCT_NAME: Cue
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - CueUITests

  CueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iOSUITests
    dependencies:
      - target: Cue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manudev.pronter.uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Cue
        GENERATE_INFOPLIST_FILE: YES

  CueMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Cue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Cue
        NSMicrophoneUsageDescription: Cue escucha tu voz para transcribir la conversación y sugerirte qué decir. Todo se procesa en tu Mac.
        NSAudioCaptureUsageDescription: Cue escucha el audio de la llamada para transcribir lo que dice la otra persona. Todo se procesa en tu Mac.
        NSScreenCaptureUsageDescription: Cue captura solo el audio del sistema para transcribir la llamada. Todo se procesa en tu Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manudev.pronter.mac
        PRODUCT_NAME: Cue
        # Firma de desarrollo estable (no ad-hoc): así el llavero y los permisos de micrófono/pantalla
        # reconocen la app entre compilaciones y no vuelven a pedir clave cada vez.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: PFXAB2V4ZM
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
